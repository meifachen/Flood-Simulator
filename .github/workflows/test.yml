name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          npm --prefix tools install
          pip install numpy rasterio geopandas swmm-toolkit==0.17.0 playwright
          python -m playwright install --with-deps chromium
      - name: Engine, SWMM readers and model builder
        run: |
          node tests/node/test_solver_core.js
          node tests/node/test_solver_guards.js
          node tests/node/test_sources.js
          node tests/node/test_swmm.js
          node tests/node/test_model.js
          node tests/node/test_couple2way.js
          node tests/node/test_velocity.js
          node tests/node/test_landcover.js
          node tests/node/test_worker.js
          node tests/node/test_results_io.js
          node tests/node/test_lakes.js
      - name: SWMM reference reproduces with the EPA engine
        run: |
          python tests/py/make_swmm_reference.py examples/synthetic_us
          git diff --exit-code --stat examples/synthetic_us/swmm_reference.json || echo "reference changed (engine version?)"
      - name: Build and browser tests
        run: |
          python tools/build.py
          python tests/browser/test_app.py 2>&1 | tee tests/browser-last.log; test "${PIPESTATUS[0]}" -eq 0
      - name: Claims gate (STATUS figures against the suites; dist built from this tree)
        run: python tools/check_claims.py --browser-log tests/browser-last.log
